# 시세·뉴스·신규 세트를 모아서 GitHub Pages에 배포 (Actions 탭 → Run workflow로 직접 실행)
# 자동 일정은 꺼 둠: 포케폴리오가 GitHub 서버의 접속을 차단(HTTP 403)해서 반복 요청하지 않도록
name: 시세 수집 & 배포

on:
  workflow_dispatch:         # Actions 탭에서 "Run workflow"로 직접 실행할 때만

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 이전 실행에서 모은 세트 결과(cache/store)를 다음 실행 때 이어서 사용
      - uses: actions/cache@v4
        with:
          path: cache
          key: pokecard-cache-${{ github.run_id }}
          restore-keys: pokecard-cache-
      - name: 데이터 수집
        run: node scripts/collect.js
        env:
          BATCH: '8'
          THROTTLE_MS: '1500'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
