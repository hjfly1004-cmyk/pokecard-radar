# 2시간마다 시세·뉴스·신규 세트를 조금씩 모아서 GitHub Pages에 배포
# (사이트에 부담을 주지 않도록 1.5초 간격으로 요청하고, 한 번에 8개 세트씩만 갱신 → 하루면 전체 한 바퀴)
name: 시세 수집 & 배포

on:
  schedule:
    - cron: '17 */2 * * *'   # 2시간마다 (정각 혼잡을 피해 17분)
  workflow_dispatch:         # Actions 탭에서 "Run workflow"로 바로 갱신
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 이전 실행에서 모은 세트 결과(cache/store)를 다음 실행 때 이어서 사용
      - uses: actions/cache@v4
        with:
          path: cache
          key: pokecard-cache-${{ github.run_id }}
          restore-keys: pokecard-cache-
      - name: 데이터 수집
        run: node scripts/collect.js
        env:
          BATCH: '8'
          THROTTLE_MS: '1500'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
